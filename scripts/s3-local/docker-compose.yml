services:
  minio:
    # No mc in this image: a top-level folder under /data is a bucket, so the entrypoint creates `eigen`.
    image: cgr.dev/chainguard/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/eigen && exec minio server /data --console-address :9001"]
    volumes:
      - minio-data:/data

volumes:
  minio-data:
