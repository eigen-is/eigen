name: Bug report
description: Something in Eigen doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't post it here. See [SECURITY.md](https://github.com/eigen-is/eigen/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? A screenshot helps.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Eigen version
      description: If you know it.
