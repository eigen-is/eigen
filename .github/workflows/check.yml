name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only check out and run lint/typecheck/test — they write nothing back, comment on
# nothing, publish nothing. Read-only token, no per-job override needed.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Primitives index
        run: bun run primitives:check

      - name: Test packages
        run: bun --filter '!@apps/api' test --timeout 30000

      - name: Test API
        run: bun --filter '@apps/api' test --parallel=4 --timeout 30000

  # The launcher under dash, BusyBox and the runner's sh, with a stub docker: no stack, no Bun.
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: bash docker/test-launcher.sh
