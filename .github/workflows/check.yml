name: Check

on:
  push:
    # A `ci-*` branch runs the checks without a pull request, for work on this workflow itself.
    branches: [main, develop, "release-*", "ci-*"]
  pull_request:
    branches: [main, develop]

# The jobs only check out and run lint/typecheck/test — they write nothing back, comment on
# nothing, publish nothing. Read-only token, no per-job override needed.
permissions:
  contents: read

# A named bash runs with -o pipefail; the default runs `bash -e` alone, so a failing command piped into tee passed.
defaults:
  run:
    shell: bash

jobs:
  # Every gate `bun run check` runs except the API, formula and sheet suites, beside the jobs that run them.
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: One version per package
        run: bun dedupe --check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Home imports
        run: bun scripts/check-home-imports.ts

      - name: Test layout
        run: bun scripts/check-test-layout.ts

      - name: Docs links
        run: bun scripts/check-docs-links.ts

      - name: Code standards
        run: bun run standards

      - name: Primitives index
        run: bun run primitives:check

      # In dependency order, one workspace after another: run all at once, they finish only 15 s sooner on four cores,
      # and the tests that time a run against a tenth of it fail.
      - name: Test packages
        run: bun --filter '!@apps/api' --filter '!@workspace/formula' --filter '!@workspace/sheet' test --timeout 30000

  # The formula suite on its own runner: in the checks job it and the sheet suite took the job past its 10 minutes.
  formula:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Test formula
        run: bun --filter '@workspace/formula' test --timeout 30000

  # The sheet suite in three shards, balanced by the per-file times in packages/sheet/src/test/timings.json: on one
  # runner it took 10.5 minutes. One file at a time per shard, so the tests that time a run have the cores to themselves.
  sheet:
    name: sheet ${{ matrix.shard }}/3
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The shard's file count and its measured times go to the files job below.
      - name: Test sheet
        working-directory: packages/sheet
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          bun run test --timeout 30000 --shard=${{ matrix.shard }}/3 --timings=src/test/timings.json --update-timings 2>&1 | tee "$RUNNER_TEMP/sheet.log"
          grep -oE 'across [0-9]+ files?' "$RUNNER_TEMP/sheet.log" | tail -1 | grep -oE '[0-9]+' > "$RUNNER_TEMP/shard/files-${{ matrix.shard }}"
          cp src/test/timings.json "$RUNNER_TEMP/shard/timings-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: sheet-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          retention-days: 7

  # The API suite in three shards, balanced by the per-file times in apps/api/src/test/timings.json.
  api:
    name: api ${{ matrix.shard }}/3
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The production image's PDF engine: Pango from the distro, WeasyPrint pinned by hash in a venv, as docker/api/Dockerfile
      # installs them, so the WeasyPrint tests run here instead of skipping; poppler-utils gives the PDF pixel tests pdftoppm.
      # The venv and the packages the runner image lacks are cached per Ubuntu release and requirements, since the Ubuntu
      # mirror took anything from 1 to 50 s to serve them. Not per image version: two of them serve runs at once while a
      # new one rolls out. A cached copy that no longer installs is built again. A change to this file starts a fresh cache.
      - uses: actions/cache@v6
        id: pdf-engine
        with:
          path: |
            ~/weasyprint
            ~/pdf-debs
          key: pdf-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/api/weasyprint-requirements.txt', '.github/workflows/check.yml') }}

      - name: WeasyPrint
        env:
          CACHED: ${{ steps.pdf-engine.outputs.cache-hit }}
        run: |
          if [ "$CACHED" != true ] || ! sudo dpkg -i ~/pdf-debs/*.deb || ! ~/weasyprint/bin/weasyprint --version; then
            rm -rf ~/pdf-debs ~/weasyprint
            sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils
            mkdir -p ~/pdf-debs && cp /var/cache/apt/archives/*.deb ~/pdf-debs/
            python3 -m venv ~/weasyprint
            ~/weasyprint/bin/pip install --require-hashes --only-binary :all: -r docker/api/weasyprint-requirements.txt
          fi
          sudo ln -s ~/weasyprint/bin/weasyprint /usr/local/bin/weasyprint
          weasyprint --version
          pdftoppm -v

      # The shard's file count and its measured times go to the files job below.
      - name: Test API
        working-directory: apps/api
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          bun run test --parallel=4 --timeout 30000 --shard=${{ matrix.shard }}/3 --timings=src/test/timings.json --update-timings 2>&1 | tee "$RUNNER_TEMP/api.log"
          grep -oE 'across [0-9]+ files?' "$RUNNER_TEMP/api.log" | tail -1 | grep -oE '[0-9]+' > "$RUNNER_TEMP/shard/files-${{ matrix.shard }}"
          cp src/test/timings.json "$RUNNER_TEMP/shard/timings-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: api-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          retention-days: 7

  # The shards of a suite ran every one of its test files between them: a file in no shard would fail no run.
  files:
    name: ${{ matrix.suite }}-files
    needs: [api, sheet]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            dir: apps/api
          - suite: sheet
            dir: packages/sheet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.suite }}-shard-*
          merge-multiple: true
          path: shards

      - name: Every ${{ matrix.suite }} test file ran once
        run: |
          total=$(find ${{ matrix.dir }} -name node_modules -prune -o -type f -regextype posix-extended -regex '.*[._](test|spec)\.[cm]?[jt]sx?' -print | wc -l)
          ran=$(cat shards/files-* | paste -sd+ | bc)
          echo "shards ran $ran of $total ${{ matrix.suite }} test files"
          [ "$ran" -eq "$total" ]

  # The launcher under dash, BusyBox and the runner's sh, with a stub docker: no stack, no Bun.
  launcher:
    runs-on: ubuntu-26.04
    # Each shell runs about 136 tests: dash and BusyBox took 5 minutes on the runner, so the three take about 8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: bash docker/test-launcher.sh

  # The operator commands on a built install, on Linux, where the checks Docker Desktop's file share hides run.
  cli:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: bash docker/test-cli.sh
