name: Publish

# A version tag publishes that release; a push to main publishes :main, the channel an install can follow.
on:
  push:
    branches: [main]
    tags: ['v*']

# A newer push to main replaces a build of main still running; a release always finishes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eigen-is/eigen

jobs:
  # The launcher reads the version from the image label, the API from package.json: on a tag they must agree.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      target: ${{ steps.meta.outputs.target }}
      candidate: ${{ steps.meta.outputs.candidate }}
      commit: ${{ steps.meta.outputs.commit }}
      built-at: ${{ steps.meta.outputs.built-at }}
      bun-version: ${{ steps.meta.outputs.bun-version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            version=$(jq -r .version package.json)
            channel=main target=main candidate=main
          else
            version=${GITHUB_REF_NAME#v}
            if [ "$(jq -r .version package.json)" != "$version" ]; then
              echo "::error::$GITHUB_REF_NAME does not match package.json $(jq -r .version package.json)"
              exit 1
            fi
            channel='' target=$version candidate=candidate-$version
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "target=$target"
            echo "candidate=$candidate"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bun-version=$(cat .bun-version)"
          } >>"$GITHUB_OUTPUT"

  # The local release gate on a clean runner: update, rollback and a breaking release through a registry of its own.
  # Only for a release; main's own checks run in check.yml.
  gate:
    needs: meta
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - run: bash docker/test-release.sh

  # Each platform builds on a runner of its own architecture, without QEMU.
  publish:
    needs: [meta, gate]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    name: publish ${{ matrix.image.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: api, context: ., file: docker/api/Dockerfile }
          - { name: frontend, context: ., file: docker/frontend/Dockerfile }
          - { name: postfix, context: docker/postfix, file: docker/postfix/Dockerfile }
          - { name: dovecot, context: docker/dovecot, file: docker/dovecot/Dockerfile }
          - { name: unbound, context: docker/unbound, file: docker/unbound/Dockerfile }
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # No provenance or SBOM: either makes a candidate an index of its own, and promote's index holds the two platform
      # images alone; the launcher pins that index's digest. An image ignores the build args it does not use. The
      # candidate tags are no version and no channel, so no launcher resolves one.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          build-args: |
            BUN_VERSION=${{ needs.meta.outputs.bun-version }}
            EIGEN_VERSION=${{ needs.meta.outputs.version }}
            EIGEN_COMMIT=${{ needs.meta.outputs.commit }}
            EIGEN_BUILT_AT=${{ needs.meta.outputs.built-at }}
            EIGEN_CHANNEL=${{ needs.meta.outputs.channel }}
            EIGEN_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ needs.meta.outputs.candidate }}-${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true,annotation.org.opencontainers.image.version=${{ needs.meta.outputs.version }},annotation.org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}

  # Only once every candidate is built, so a failed build publishes no version. The version, or :main, is the index of
  # an image's two candidates, which keep their annotations; :latest is a byte-for-byte copy of the version, digest and
  # all. :latest last, and never for a prerelease or main.
  promote:
    needs: [meta, publish]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TARGET: ${{ needs.meta.outputs.target }}
      CANDIDATE: ${{ needs.meta.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Here and below, IMAGES in ./eigen: the images a release pins.
      - run: |
          for name in $(sed -n "s/^IMAGES='\(.*\)'/\1/p" eigen); do
            docker buildx imagetools create -t "$REGISTRY/$name:$TARGET" \
              "$REGISTRY/$name:$CANDIDATE-amd64" "$REGISTRY/$name:$CANDIDATE-arm64"
          done

      - if: ${{ github.ref_type == 'tag' && !contains(needs.meta.outputs.version, '-') }}
        run: |
          for name in $(sed -n "s/^IMAGES='\(.*\)'/\1/p" eigen); do
            docker buildx imagetools create --prefer-index=false \
              -t "$REGISTRY/$name:latest" "$REGISTRY/$name:$VERSION"
          done
