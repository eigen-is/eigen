name: Publish

# A version tag publishes that release; a push to main publishes :main, the channel an install can follow. A release
# whose CHANGELOG lists breaking changes fails the gate; run this workflow on its tag with breaking: true to publish it.
# Nothing else publishes: a run on another branch or tag fails in meta.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      breaking:
        description: The release lists breaking changes since the previous one, and that is intended
        type: boolean
        default: false

# GitHub keeps one pending run per group and lets the running one finish, so a cancel never leaves :main mixed: a
# promote that stopped between two images.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eigen-is/eigen

jobs:
  # Only main and a v* tag publish, whatever started the run. The launcher reads the version from the image label, the
  # API from package.json: on a tag they must agree.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      target: ${{ steps.meta.outputs.target }}
      commit: ${{ steps.meta.outputs.commit }}
      built-at: ${{ steps.meta.outputs.built-at }}
      bun-version: ${{ steps.meta.outputs.bun-version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          case $GITHUB_REF in
            refs/heads/main)
              version=$(jq -r .version package.json)
              channel=main target=main
              ;;
            refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              if [ "$(jq -r .version package.json)" != "$version" ]; then
                echo "::error::$GITHUB_REF_NAME does not match package.json $(jq -r .version package.json)"
                exit 1
              fi
              channel='' target=$version
              ;;
            *)
              echo "::error::$GITHUB_REF publishes nothing: only main and v* tags do"
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "target=$target"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bun-version=$(cat .bun-version)"
          } >>"$GITHUB_OUTPUT"

  # Each platform builds on a runner of its own architecture, without QEMU.
  publish:
    needs: meta
    name: publish ${{ matrix.image.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: api, context: ., file: docker/api/Dockerfile }
          - { name: frontend, context: ., file: docker/frontend/Dockerfile }
          - { name: postfix, context: docker/postfix, file: docker/postfix/Dockerfile }
          - { name: dovecot, context: docker/dovecot, file: docker/dovecot/Dockerfile }
          - { name: unbound, context: docker/unbound, file: docker/unbound/Dockerfile }
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # No provenance or SBOM: either makes a candidate an index of its own, and promote's index holds the two platform
      # images alone; the launcher pins that index's digest. An image ignores the build args it does not use. A
      # candidate, candidate-<version or main>-<platform>, is no version, latest or main, so the launcher refuses it.
      # Its created annotation is this run's, which the release gate waits for and promote checks: a candidate of
      # another run is not this one.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          build-args: |
            BUN_VERSION=${{ needs.meta.outputs.bun-version }}
            EIGEN_VERSION=${{ needs.meta.outputs.version }}
            EIGEN_COMMIT=${{ needs.meta.outputs.commit }}
            EIGEN_BUILT_AT=${{ needs.meta.outputs.built-at }}
            EIGEN_CHANNEL=${{ needs.meta.outputs.channel }}
            EIGEN_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:candidate-${{ needs.meta.outputs.target }}-${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true,annotation.org.opencontainers.image.version=${{ needs.meta.outputs.version }},annotation.org.opencontainers.image.revision=${{ needs.meta.outputs.commit }},annotation.org.opencontainers.image.created=${{ needs.meta.outputs.built-at }}

  # The release gate on a clean runner, beside the builds: the previous published release updated to this run's amd64
  # candidates, the images promote publishes, and rolled back; then update, rollback and a breaking release through a
  # registry of its own. It builds those releases while it waits for the candidates. Only for a release; main's own
  # checks run in check.yml. It reads this run's jobs to stop waiting once a build failed: needs publish would wait for
  # every build before it starts its own.
  gate:
    needs: meta
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - run: bash docker/test-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_BREAKING: ${{ inputs.breaking && '1' || '' }}
          CANDIDATE: candidate-${{ needs.meta.outputs.target }}-amd64
          CANDIDATE_CREATED: ${{ needs.meta.outputs.built-at }}

  # The arm64 candidates, installed with mail off on an arm64 runner, answer /eigen/health.
  boot-arm64:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - run: bash docker/test-boot.sh
        env:
          CANDIDATE: candidate-${{ needs.meta.outputs.target }}-arm64

  # Only once every candidate is built, and on a tag both gates passed on them, so a failed build or gate publishes no
  # version. main has no gates. The version, or :main, is the index of an image's two candidates, which keep their
  # annotations; :latest is a byte-for-byte copy of the version, digest and all. :latest last, and never for a
  # prerelease, a backport or main.
  promote:
    needs: [meta, publish, gate, boot-arm64]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && (
      (github.ref_type == 'tag' && needs.gate.result == 'success' && needs.boot-arm64.result == 'success') ||
      (github.ref_type == 'branch' && needs.gate.result == 'skipped' && needs.boot-arm64.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TARGET: ${{ needs.meta.outputs.target }}
      BUILT_AT: ${{ needs.meta.outputs.built-at }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # IMAGES in ./eigen, the images a release pins, here and in the steps below. The index takes each candidate by
      # digest once its created annotation shows this run built it: a later run may have rebuilt the tag since.
      - run: |
          IMAGES=$(sed -n "s/^IMAGES='\(.*\)'/\1/p" eigen)
          echo "IMAGES=$IMAGES" >>"$GITHUB_ENV"
          for name in $IMAGES; do
            refs=()
            for platform in amd64 arm64; do
              tag=$REGISTRY/$name:candidate-$TARGET-$platform
              ref=$REGISTRY/$name@$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" { print $2 }')
              created=$(docker buildx imagetools inspect --raw "$ref" |
                jq -r '.annotations["org.opencontainers.image.created"]')
              if [ "$created" != "$BUILT_AT" ]; then
                echo "::error::$tag was built at '$created', not by this run at $BUILT_AT"
                exit 1
              fi
              refs+=("$ref")
            done
            docker buildx imagetools create -t "$REGISTRY/$name:$TARGET" "${refs[@]}"
          done

      # A backport, such as 0.2.1 after 0.3.0, leaves :latest on the newest stable release.
      - if: ${{ github.ref_type == 'tag' && !contains(needs.meta.outputs.version, '-') }}
        run: |
          set -o pipefail
          . docker/probe-lib.sh
          releases=$(published_releases)
          newest=$(printf '%s\n' "$VERSION" "$releases" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ "$newest" != "$VERSION" ]; then
            echo "::notice::$newest is out, so :latest stays on it"
            exit 0
          fi
          for name in $IMAGES; do
            docker buildx imagetools create --prefer-index=false \
              -t "$REGISTRY/$name:latest" "$REGISTRY/$name:$VERSION"
          done
