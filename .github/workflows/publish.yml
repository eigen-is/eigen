name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eigen-is/eigen

jobs:
  # The local release gate on a clean runner: update, rollback and a breaking release through a registry of its own.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      built-at: ${{ steps.meta.outputs.built-at }}
      bun-version: ${{ steps.meta.outputs.bun-version }}
    steps:
      - uses: actions/checkout@v4

      # The launcher reads the version from the image label, the API from package.json: they must agree.
      - id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match package.json $(jq -r .version package.json)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bun-version=$(cat .bun-version)"
          } >>"$GITHUB_OUTPUT"

      - run: bash docker/test-release.sh

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: docker/api/Dockerfile }
          - { name: frontend, context: ., file: docker/frontend/Dockerfile }
          - { name: postfix, context: docker/postfix, file: docker/postfix/Dockerfile }
          - { name: dovecot, context: docker/dovecot, file: docker/dovecot/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # No provenance or SBOM: either turns the push into an index, whose digest is not the one the launcher pins
      # from RepoDigests and compares with `docker manifest inspect -v`. An image ignores the build args it does not use.
      # The candidate tag is no version, so no launcher resolves it; promote names it once all four are built.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            BUN_VERSION=${{ needs.gate.outputs.bun-version }}
            EIGEN_VERSION=${{ needs.gate.outputs.version }}
            EIGEN_COMMIT=${{ needs.gate.outputs.commit }}
            EIGEN_BUILT_AT=${{ needs.gate.outputs.built-at }}
            EIGEN_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:candidate-${{ needs.gate.outputs.version }}
          outputs: type=image,push=true,oci-mediatypes=true,annotation.org.opencontainers.image.version=${{ needs.gate.outputs.version }}

  # Only once all four are built, so a failed build publishes no version; byte-for-byte copies, so the version and
  # :latest have the candidate's digest and annotation. :latest last, and never for a prerelease.
  promote:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Here and below, the four images docker-compose.yml runs; IMAGES in ./eigen and IMAGE_NAMES in install.ts too.
      - run: |
          for name in api frontend postfix dovecot; do
            docker buildx imagetools create --prefer-index=false \
              -t "$REGISTRY/$name:$VERSION" "$REGISTRY/$name:candidate-$VERSION"
          done

      - if: ${{ !contains(needs.gate.outputs.version, '-') }}
        run: |
          for name in api frontend postfix dovecot; do
            docker buildx imagetools create --prefer-index=false \
              -t "$REGISTRY/$name:latest" "$REGISTRY/$name:$VERSION"
          done
