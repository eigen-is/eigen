# Eigen in Docker on a developer's machine. In a clone of its own, copy this file to docker-compose.override.yml, then
# run ./eigen setup --domain localhost --yes. The API runs in development mode, Mailpit (http://localhost:8025) catches
# the mail it sends, and postfix and dovecot make a self-signed certificate in data/certs/dev.

services:
  caddy:
    environment:
      CADDY_ACME_EMAIL: ""
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  eigen-api:
    user: ""
    environment:
      PRODUCTION: 0
      # Plain-HTTP cookies, dev warnings, and better-auth's limiter off unless forced on.
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

  postfix:
    volumes:
      - ./data/certs/dev:/certs:ro
    environment:
      SMTP_RELAY_HOST: ""

  dovecot:
    volumes:
      - ./data/certs/dev:/certs

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [eigen]
