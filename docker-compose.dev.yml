# Dev overrides: HTTP-only, mailpit for catching mail, self-signed certs.
# Addresses need a dotted domain (better-auth refuses user@localhost), so mail defaults to eigen.localhost.
#
# Dev runs all profiles by default: COMPOSE_PROFILES=edge,mail.

# MAIL_DOMAIN from .env wins, e.g. for a ./data set up with a real org domain.
x-dev-domains: &dev-domains
  DOMAIN: localhost
  MAIL_DOMAIN: ${MAIL_DOMAIN:-eigen.localhost}

services:
  caddy:
    environment:
      <<: *dev-domains
      CADDY_ACME_EMAIL: ""
    ports:
      - "80:80"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  eigen-api:
    user: ""
    environment:
      <<: *dev-domains
      PRODUCTION: 0
      # Override the base compose's NODE_ENV=production so local dev / test-deployments.sh keep
      # dev behaviour (HTTP-only cookies, dev warnings, BA limiter off unless forced on).
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

  eigen-static:
    environment: *dev-domains

  postfix:
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs/dev:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      <<: *dev-domains
      SMTP_RELAY_HOST: ""

  dovecot:
    volumes:
      - ./data:/data
      - ./data/certs/dev:/certs
    environment: *dev-domains

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [eigen]
