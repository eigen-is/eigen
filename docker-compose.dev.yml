# Dev overrides: HTTP-only, mailpit for catching mail, self-signed certs.
# DOMAIN=localhost is the hostname for TLS certs and Postfix. Email addresses use a separate
# domain configured during setup (e.g., eigen.localhost) — see LOCAL-TESTING.md.
#
# Dev runs all profiles by default: COMPOSE_PROFILES=edge,mail.
services:
  caddy:
    environment:
      DOMAIN: localhost
      MAIL_DOMAIN: localhost
      CADDY_ACME_EMAIL: ""
    ports:
      - "80:80"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  eigen-api:
    user: ""
    environment:
      PRODUCTION: 0
      # Override the base compose's NODE_ENV=production so local dev / test-deployments.sh keep
      # dev behaviour (HTTP-only cookies, dev warnings, BA limiter off unless forced on).
      NODE_ENV: development
      EIGEN_DATA_ROOT: /app/data
      DOMAIN: localhost
      MAIL_DOMAIN: localhost
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      COOKIE_DOMAIN: localhost
      TRUSTED_NETWORKS: "127.0.0.0/8,::1,172.16.0.0/12"

  eigen-static:
    environment:
      DOMAIN: localhost
      MAIL_DOMAIN: localhost

  postfix:
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs/dev:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      DOMAIN: localhost
      MAIL_DOMAIN: localhost
      SMTP_RELAY_HOST: ""

  dovecot:
    volumes:
      - ./data:/data
      - ./data/certs/dev:/certs
    environment:
      DOMAIN: localhost
      MAIL_DOMAIN: localhost

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [eigen]
