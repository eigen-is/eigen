services:
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/export-certs.sh:/usr/local/bin/export-certs.sh:ro
      - ./docker/caddy/autoconfig.xml:/etc/caddy/autoconfig.xml:ro
      - ./dist:/www:ro
      - ./caddy-data:/data
      - ./data/certs:/shared-certs
    env_file: .env.production
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      CADDY_ACME_EMAIL: "email ${ACME_EMAIL:-admin@${DOMAIN}}"
    command: sh -c "/usr/local/bin/export-certs.sh & caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  eigen-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    user: "1000:1000"
    ports:
      - "${EIGEN_API_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ./data:/app/data
    # Lets the API reach a host-side mail server via SMTP_HOST=host.docker.internal in
    # scenarios where the bundled postfix is off. Harmless when bundled postfix is on.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PRODUCTION: 1
      EIGEN_DATA_ROOT: /app/data
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-25}
      COOKIE_DOMAIN: .${DOMAIN}
      TRUSTED_NETWORKS: "127.0.0.0/8,::1,172.16.0.0/12"
    restart: unless-stopped
    networks: [eigen]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  unbound:
    profiles: ["mail"]
    image: mvance/unbound:latest
    restart: unless-stopped
    networks:
      eigen:
        ipv4_address: 172.20.0.254
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postfix:
    profiles: ["mail"]
    build:
      context: docker/postfix
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    dns: [172.20.0.254]
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
    depends_on:
      eigen-api:
        condition: service_healthy
      dovecot:
        condition: service_started
      unbound:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  dovecot:
    profiles: ["mail"]
    build:
      context: docker/dovecot
    ports:
      - "993:993"
    volumes:
      - ./data:/data
      - ./data/certs:/certs
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postfix-queue:

networks:
  eigen:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
