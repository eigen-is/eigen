services:
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/export-certs.sh:/usr/local/bin/export-certs.sh:ro
      - ./docker/caddy/autoconfig.xml:/etc/caddy/autoconfig.xml:ro
      - ./dist:/www:ro
      - ./caddy-data:/data
      - ./data/certs:/shared-certs
    env_file: .env.production
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      CADDY_ACME_EMAIL: "email ${ACME_EMAIL:-admin@${DOMAIN}}"
    command: sh -c "/usr/local/bin/export-certs.sh & caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  eigen-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    user: "1000:1000"
    # No host port binding — caddy / eigen-static / postfix / dovecot all reach the API via
    # the docker network as `eigen-api:8000`. For host-side debug access, layer the
    # docker-compose.host-api.yml overlay (binds 127.0.0.1:${EIGEN_API_BIND_PORT:-8000}).
    volumes:
      - ./data:/app/data
    # Lets the API reach a host-side mail server via SMTP_HOST=host.docker.internal in
    # scenarios where the bundled postfix is off. Harmless when bundled postfix is on.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PRODUCTION: 1
      # Conventional production signal for third-party libs that gate on it (e.g. better-auth
      # rate limiting + secure cookies). Set at runtime only — never as a Dockerfile build ENV,
      # which would make `bun install` skip devDependencies. Dev overrides this back (dev compose).
      NODE_ENV: production
      EIGEN_DATA_ROOT: /app/data
      # Demo-instance mode (hourly wipe + reseed via scripts/demo-reset.sh). Unset on real
      # instances → 0, so the demo entry route + auth guards stay inert.
      EIGEN_DEMO: ${EIGEN_DEMO:-0}
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-25}
      COOKIE_DOMAIN: .${DOMAIN}
      TRUSTED_NETWORKS: "127.0.0.0/8,::1,172.16.0.0/12"
      EIGEN_COMMIT: ${EIGEN_COMMIT:-}
      EIGEN_BUILT_AT: ${EIGEN_BUILT_AT:-}
    restart: unless-stopped
    # On SIGTERM the API drains pending S3 uploads before exit (SHUTDOWN_DRAIN_BUDGET_MS=20s,
    # index.ts). Give it more than Docker's 10s default so a healthy drain completes; anything
    # still in flight past this is SIGKILLed and replays from pending_uploads on next boot.
    stop_grace_period: 30s
    # Each open Home costs ~25-30 fds (~6 WAL SQLite DBs × 3 files each + ~10 maildir fs.watch
    # handles). Distro/Docker defaults (often 1024 soft) cap concurrent open homes at ~35, and
    # cross-home fan-outs (e.g. sharing to a large team) then fail with SQLITE_IOERR and
    # silently skip recipients. Pin the limit high — fds are cheap kernel objects.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks: [eigen]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  eigen-static:
    profiles: ["static"]
    build:
      context: .
      dockerfile: docker/static/Dockerfile
    # Long-form bind so EIGEN_STATIC_HOST/PORT substitute cleanly. Avoid the short-form
    # `${IP}:${PORT}:8080` shape — the colon between vars confuses some Compose versions.
    ports:
      - target: 8080
        published: "${EIGEN_STATIC_PORT:-8080}"
        host_ip: "${EIGEN_STATIC_HOST:-127.0.0.1}"
        protocol: tcp
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  unbound:
    profiles: ["mail"]
    image: mvance/unbound:latest
    restart: unless-stopped
    networks:
      eigen:
        ipv4_address: ${EIGEN_UNBOUND_IP:-172.20.0.254}
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postfix:
    profiles: ["mail"]
    build:
      context: docker/postfix
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    dns: ["${EIGEN_UNBOUND_IP:-172.20.0.254}"]
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      # queue-monitor.sh: notify the org owner when the queue backs up (spam-run early warning).
      QUEUE_CHECK_INTERVAL: ${QUEUE_CHECK_INTERVAL:-300}
      QUEUE_ALERT_THRESHOLD: ${QUEUE_ALERT_THRESHOLD:-200}
    depends_on:
      eigen-api:
        condition: service_healthy
      dovecot:
        condition: service_started
      unbound:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    # Bigger than the other services keep: this log is the record of an abuse run, and what a
    # host-side fail2ban reads. During the 2026-08-31 incident 3x10MB rotated away in about two
    # hours and took the start of the run with it.
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  dovecot:
    profiles: ["mail"]
    build:
      context: docker/dovecot
    ports:
      - "993:993"
    volumes:
      - ./data:/data
      - ./data/certs:/certs
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postfix-queue:

networks:
  eigen:
    driver: bridge
    ipam:
      config:
        # Override via EIGEN_SUBNET / EIGEN_UNBOUND_IP if 172.20.0.0/24 conflicts with your
        # host. The two must stay consistent (unbound's IP must lie inside the subnet).
        - subnet: ${EIGEN_SUBNET:-172.20.0.0/24}
