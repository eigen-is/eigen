services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/export-certs.sh:/usr/local/bin/export-certs.sh:ro
      - ./dist:/www:ro
      - ./caddy-data:/data
      - ./data/certs:/shared-certs
    env_file: .env.production
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_ACME_EMAIL: "email ${ACME_EMAIL:-admin@${DOMAIN}}"
    command: sh -c "/usr/local/bin/export-certs.sh & caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  eigen-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    user: "1000:1000"
    volumes:
      - ./data:/app/data
    environment:
      PRODUCTION: 1
      EIGEN_DATA_ROOT: /app/data
      DOMAIN: ${DOMAIN}
      SMTP_HOST: postfix
      SMTP_PORT: 25
      COOKIE_DOMAIN: .${DOMAIN}
      TRUSTED_NETWORKS: "127.0.0.0/8,::1,172.16.0.0/12"
    restart: unless-stopped
    networks: [eigen]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postfix:
    build:
      context: docker/postfix
    ports:
      - "25:25"
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      DOMAIN: ${DOMAIN}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  dovecot:
    build:
      context: docker/dovecot
    ports:
      - "993:993"
    volumes:
      - ./data:/data
      - ./data/certs:/certs
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postfix-queue:

networks:
  eigen:
    driver: bridge
