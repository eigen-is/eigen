x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Bigger for postfix and dovecot: their logs are the record of an abuse run, and what a host-side fail2ban reads.
# During the 2026-08-31 incident 3x10MB rotated away in about two hours and took the start of the run with it.
x-mail-logging: &mail-logging
  driver: json-file
  options: { max-size: "50m", max-file: "10" }

x-domains: &domains
  DOMAIN: ${DOMAIN}
  MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}

services:
  caddy:
    profiles: ["edge"]
    image: &frontend-image ${EIGEN_FRONTEND_IMAGE:-ghcr.io/eigen-is/eigen/frontend:local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy-data:/data
      - ./data/certs:/shared-certs
    environment:
      <<: *domains
      CADDY_ACME_EMAIL: "email ${ACME_EMAIL:-admin@${MAIL_DOMAIN:-${DOMAIN}}}"
    command: sh -c "/usr/local/bin/export-certs.sh & caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    restart: unless-stopped
    networks: [eigen]
    logging: *logging

  eigen-api:
    image: ${EIGEN_API_IMAGE:-ghcr.io/eigen-is/eigen/api:local}
    user: "1000:1000"
    # A real PID 1: forwards SIGTERM to bun and reaps its ffmpeg/weasyprint children.
    init: true
    # No host port binding — caddy / eigen-static / postfix / dovecot all reach the API via
    # the docker network as `eigen-api:8000`. A host port for debugging: docker/SETUP-GUIDE.md.
    volumes:
      - ./data:/app/data
      # Backup artifacts live outside data/ so a wipe of the data directory cannot take them with
      # it. `./eigen backup` writes its whole-server snapshots to ./snapshots instead. The API creates
      # the folder only when the first backup runs; Docker creates the mount point itself.
      - ./backups:/app/backups
    # Lets the API reach a relay on the host (SMTP_RELAY_HOST=host.docker.internal) when Eigen hosts no mail.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.production
    environment:
      PRODUCTION: 1
      # Conventional production signal for third-party libs that gate on it (e.g. better-auth
      # rate limiting + secure cookies). Set at runtime only — never as a Dockerfile build ENV,
      # which would make `bun install` skip devDependencies. Dev overrides this back (dev compose).
      NODE_ENV: production
      EIGEN_DATA_ROOT: /app/data
      EIGEN_BACKUPS_DIR: /app/backups
      # Demo-instance mode (hourly wipe + reseed via scripts/demo-reset.sh). Unset on real
      # instances → 0, so the demo entry route + auth guards stay inert.
      EIGEN_DEMO: ${EIGEN_DEMO:-0}
      # Off (0) on a deployment whose COMPOSE_PROFILES omits `mail`, so the apps hide every Mail entry point.
      MAIL_ENABLED: ${MAIL_ENABLED:-1}
      # Hosting mail, the API hands its mail to postfix, which relays through SMTP_RELAY_*. With MAIL_ENABLED=0
      # the API ignores these and sends through SMTP_RELAY_* (from env_file) itself.
      SMTP_HOST: postfix
      SMTP_PORT: 25
      # Loopback plus the docker bridge subnet (same EIGEN_SUBNET the network and postfix use), so
      # Postfix/Dovecot bridge callers are trusted without the whole 172.16/12 range.
      TRUSTED_NETWORKS: "127.0.0.0/8,::1,${EIGEN_SUBNET:-172.20.0.0/24}"
    restart: unless-stopped
    # On SIGTERM the API drains pending S3 uploads before exit (SHUTDOWN_DRAIN_BUDGET_MS=20s,
    # index.ts). Give it more than Docker's 10s default so a healthy drain completes; anything
    # still in flight past this is SIGKILLed and replays from pending_uploads on next boot.
    stop_grace_period: 30s
    # Each open Home costs ~25-30 fds (~6 WAL SQLite DBs × 3 files each + ~10 maildir fs.watch
    # handles). Distro/Docker defaults (often 1024 soft) cap concurrent open homes at ~35, and
    # cross-home fan-outs (e.g. sharing to a large team) then fail with SQLITE_IOERR and
    # silently skip recipients. Pin the limit high — fds are cheap kernel objects.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks: [eigen]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging

  eigen-static:
    profiles: ["static"]
    image: *frontend-image
    command: caddy run --config /etc/caddy/Caddyfile.static --adapter caddyfile
    # Long-form bind so EIGEN_STATIC_HOST/PORT substitute cleanly. Avoid the short-form
    # `${IP}:${PORT}:8080` shape — the colon between vars confuses some Compose versions.
    ports:
      - target: 8080
        published: "${EIGEN_STATIC_PORT:-8080}"
        host_ip: "${EIGEN_STATIC_HOST:-127.0.0.1}"
        protocol: tcp
    environment: *domains
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging: *logging

  unbound:
    profiles: ["mail"]
    # mvance/unbound:latest as resolved on 2026-09-23 (linux/amd64 only).
    image: mvance/unbound@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    restart: unless-stopped
    networks:
      eigen:
        ipv4_address: ${EIGEN_UNBOUND_IP:-172.20.0.254}
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  postfix:
    profiles: ["mail"]
    image: ${EIGEN_POSTFIX_IMAGE:-ghcr.io/eigen-is/eigen/postfix:local}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    dns: ["${EIGEN_UNBOUND_IP:-172.20.0.254}"]
    volumes:
      - ./data/dkim:/data/dkim
      - ./data/certs:/certs:ro
      - postfix-queue:/var/spool/postfix
    environment:
      <<: *domains
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      # queue-monitor.sh: notify the org owner when the queue backs up (spam-run early warning).
      QUEUE_CHECK_INTERVAL: ${QUEUE_CHECK_INTERVAL:-300}
      QUEUE_ALERT_THRESHOLD: ${QUEUE_ALERT_THRESHOLD:-200}
      QUEUE_ALERT_COOLDOWN: ${QUEUE_ALERT_COOLDOWN:-21600}
      # The docker bridge subnet, kept in lockstep with the `eigen` network below (same default).
      # entrypoint.sh scopes Postfix `mynetworks` + OpenDKIM `InternalHosts` to loopback plus this
      # value, so eigen-api (172.20.0.x by default) can submit and get its mail DKIM-signed without
      # trusting the whole 172.16/12 range. Unset → loopback only (fail closed).
      EIGEN_SUBNET: ${EIGEN_SUBNET:-172.20.0.0/24}
    depends_on:
      eigen-api:
        condition: service_healthy
      dovecot:
        condition: service_started
      unbound:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging: *mail-logging

  dovecot:
    profiles: ["mail"]
    image: ${EIGEN_DOVECOT_IMAGE:-ghcr.io/eigen-is/eigen/dovecot:local}
    ports:
      - "993:993"
    volumes:
      - ./data:/data
      - ./data/certs:/certs
    environment: *domains
    depends_on:
      eigen-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [eigen]
    logging: *mail-logging

volumes:
  postfix-queue:

networks:
  eigen:
    driver: bridge
    ipam:
      config:
        # Override via EIGEN_SUBNET / EIGEN_UNBOUND_IP if 172.20.0.0/24 conflicts with your
        # host. The two must stay consistent (unbound's IP must lie inside the subnet).
        - subnet: ${EIGEN_SUBNET:-172.20.0.0/24}
