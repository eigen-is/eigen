# Fail2ban jails — ban IPs that flood Eigen's mail ports with failed logins: one jail for Postfix's
# submission ports, one for Dovecot's IMAPS. Host-side and opt-in; see README.md in this directory
# for installation.
#
# The two are separate jails because they read different log lines and each keeps its own count. A
# botnet that sprays both spends both budgets, and either one bans it on all ports.
#
# The settings below are repeated per jail on purpose: a [DEFAULT] section here would leak into every
# other jail on the host, sshd included.

[eigen-postfix-sasl]
enabled  = true
filter   = eigen-postfix-sasl
# The container id changes on every rebuild, so glob all Docker json logs; the filter regex is
# postfix-specific, so other containers' lines simply never match. Polling survives the log
# rotation that inotify watches lose track of.
backend  = polling
logpath  = /var/lib/docker/containers/*/*-json.log

# Ban on all ports: the same botnet retries on 25/465/587 and often IMAP too.
# chain=DOCKER-USER is load-bearing — Docker's published ports are DNAT'd before the INPUT chain,
# so a ban in INPUT would never see the packets.
action   = iptables-allports[name=eigen-postfix-sasl, chain="DOCKER-USER"]

maxretry = 5
findtime = 10m
bantime  = 1h
# A returning botnet earns a longer ban each time.
bantime.increment = true
bantime.maxtime   = 2d

[eigen-dovecot-auth]
enabled  = true
filter   = eigen-dovecot-auth
backend  = polling
logpath  = /var/lib/docker/containers/*/*-json.log
action   = iptables-allports[name=eigen-dovecot-auth, chain="DOCKER-USER"]

maxretry = 5
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.maxtime   = 2d
