# Fail2ban filter — SASL authentication failures on Eigen's bundled Postfix.
#
# Reads the Docker json-file log, where each line wraps one postfix stdout line:
#   {"log":"Aug 31 12:00:00 mail postfix/smtps[123]: warning: unknown[203.0.113.9]: SASL LOGIN
#    authentication failed: UGFzc3dvcmQ6\n","stream":"stdout","time":"2026-08-31T12:00:00.1Z"}
#
# That wrapper is why this filter exists instead of the distro's postfix filter: the json prefix
# breaks the syslog line anchor the distro filter uses, and it puts the date somewhere else. The
# failure pattern itself is the distro's idiom, host part included: postfix writes the client's
# rDNS name when it has one and `unknown` when it does not, and `[-._\w]+` covers both. Do not
# reach for `[[:alnum:]]` here — fail2ban compiles these with Python `re`, which has no POSIX
# classes and would silently match neither form.

[Definition]

failregex = ^.*warning: [-._\w]+\[<HOST>\]: SASL (?:LOGIN|PLAIN) authentication failed

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
