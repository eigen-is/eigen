# Fail2ban filter — SASL authentication failures on Eigen's bundled Postfix.
#
# Reads the Docker json-file log, where each line wraps one postfix stdout line:
#   {"log":"Aug 31 12:00:00 mail postfix/smtps[123]: warning: unknown[203.0.113.9]: SASL LOGIN
#    authentication failed: UGFzc3dvcmQ6\n","stream":"stdout","time":"2026-08-31T12:00:00.1Z"}
#
# Two details matter. Postfix writes these lines with `unknown[<ip>]` and NO `client=` field, so
# the distro's postfix-sasl filter does not match them. And the date is taken from the json `time`
# field rather than the start of the line, since the json wrapper sits in front of postfix's own
# timestamp.

[Definition]

failregex = ^.*warning: unknown\[<HOST>\]: SASL (?:LOGIN|PLAIN) authentication failed

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
