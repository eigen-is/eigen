# Fail2ban filter — failed IMAP logins on Eigen's bundled Dovecot.
#
# Postfix's SASL failures are only half the traffic: dovecot serves IMAPS on :993 directly, so a
# botnet that gives up on submission and starts guessing over IMAP never appears in the postfix log.
#
# Dovecot logs to stderr (`log_path = /dev/stderr` in docker/dovecot/dovecot.conf), so each line
# arrives wrapped by the Docker json-file driver:
#   {"log":"Aug 31 12:00:00 imap-login: Info: Aborted login (auth failed, 1 attempts in 4 secs):
#    user=<you@example.com>, method=PLAIN, rip=203.0.113.9, lip=172.20.0.5, TLS, session=<abc>\n",
#    "stream":"stderr","time":"2026-08-31T12:00:00.1Z"}
#
# First pattern: the login process's own line, written once per failed login. `auth failed` is
# load-bearing — without it the same line shape covers ordinary disconnects and would ban clients
# that did nothing wrong.
#
# Second pattern: the auth process's line for the same attempt, which our checkpassword passdb
# writes as `checkpassword(<user>,<ip>)`. That prefix is what probe 10 of docker/test-mail-hardening.sh
# reads the client address out of. If a dovecot version words the message differently the pattern
# simply never matches, and the first one still counts the attempt — check both with `fail2ban-regex`
# against a real log (see README.md).

[Definition]

failregex = ^.*-login: Info: (?:Aborted login|Disconnected)[^\n]*\(auth failed[^\n]*rip=<HOST>
            ^.*auth: Info: checkpassword\([^,]*,<HOST>[,)][^\n]*Login failed

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
