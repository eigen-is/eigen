# Test version of the nginx snippet generated by scripts/setup.ts. Differs from the host
# snippet in two ways: plain HTTP instead of TLS, and proxies to `eigen-static:8080` over
# the docker network instead of `127.0.0.1:8080` on the host. The proxy headers, WebSocket
# upgrade map, SSE buffering, and timeout settings are identical — that's the part being
# verified.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    location / {
        proxy_pass http://eigen-static:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }
}
