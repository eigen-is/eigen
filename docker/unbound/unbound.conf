# The recursive, DNSSEC-validating resolver the bundled Postfix finds other domains' mail servers through.
server:
    interface: 0.0.0.0
    do-ip6: no
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
    harden-dnssec-stripped: yes
    harden-glue: yes
    qname-minimisation: yes
    prefetch: yes
    hide-identity: yes
    hide-version: yes
    num-threads: 1
    use-syslog: no
    logfile: ""
    verbosity: 1
    username: ""

remote-control:
    control-enable: no
