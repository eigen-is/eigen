protocols = imap

# TLS
ssl = required
ssl_cert = </certs/cert.pem
ssl_key = </certs/key.pem
ssl_min_protocol = TLSv1.2

# Auth via checkpassword script (calls Eigen API)
auth_mechanisms = plain login

passdb {
    driver = checkpassword
    args = /usr/local/bin/eigen-checkpassword /usr/lib/dovecot/checkpassword-reply
}

userdb {
    driver = prefetch
}

mail_location = maildir:~/Maildir
first_valid_uid = 1

# Namespace — separator "." matches Maildir++ dot-prefix layout (.Sent/, .Drafts/)
namespace inbox {
    inbox = yes
    separator = .

    mailbox Sent {
        auto = subscribe
        special_use = \Sent
    }
    mailbox Drafts {
        auto = subscribe
        special_use = \Drafts
    }
    mailbox Trash {
        auto = subscribe
        special_use = \Trash
    }
    mailbox Junk {
        auto = subscribe
        special_use = \Junk
    }
    mailbox Archive {
        auto = subscribe
        special_use = \Archive
    }
}

# Logging to stderr (Docker)
log_path = /dev/stderr
info_log_path = /dev/stderr

# Performance
mail_fsync = optimized

# Allow plaintext auth over TLS (required for checkpassword)
auth_verbose = yes
disable_plaintext_auth = yes
