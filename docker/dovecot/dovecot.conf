protocols = imap

# TLS
ssl = required
ssl_cert = </certs/cert.pem
ssl_key = </certs/key.pem
ssl_min_protocol = TLSv1.2

# Auth via checkpassword script (calls Eigen API)
auth_mechanisms = plain login

passdb {
    driver = checkpassword
    args = /usr/local/bin/eigen-checkpassword /usr/lib/dovecot/checkpassword-reply
}

userdb {
    driver = prefetch
}

mail_location = maildir:~/Maildir
first_valid_uid = 1

# All Maildirs are owned by the vmail user (UID 1000), matching the eigen-api
# container. Run imap workers as vmail so they can read/write Maildirs.
service imap {
    user = vmail
}

# Namespace — separator "." matches Maildir++ dot-prefix layout (.Sent/, .Drafts/)
namespace inbox {
    inbox = yes
    separator = .

    mailbox Sent {
        auto = subscribe
        special_use = \Sent
    }
    mailbox Drafts {
        auto = subscribe
        special_use = \Drafts
    }
    mailbox Trash {
        auto = subscribe
        special_use = \Trash
    }
    mailbox Junk {
        auto = subscribe
        special_use = \Junk
    }
    mailbox Archive {
        auto = subscribe
        special_use = \Archive
    }
}

# SASL auth service for Postfix SMTP submission.
# Binds on the Docker bridge network only (port 12345 is NOT published to host).
service auth {
    inet_listener {
        port = 12345
    }
}

# Logging to stderr (Docker)
log_path = /dev/stderr
info_log_path = /dev/stderr

# Performance
mail_fsync = optimized

# Plaintext auth (PLAIN/LOGIN) is safe because ssl=required enforces TLS on all connections
auth_verbose = yes
disable_plaintext_auth = yes
