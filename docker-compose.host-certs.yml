# Postfix and dovecot get their certificate from the bundled Caddy. Without it (COMPOSE_PROFILES without edge), this
# gives them the host's Let's Encrypt certificate for DOMAIN, the address mail clients connect to. Copy this file to
# docker-compose.override.yml, then run ./eigen restart. Its !override tag needs Compose 2.24.4 or newer.
#
# Reload them after each renewal with a certbot deploy hook, /etc/letsencrypt/renewal-hooks/deploy/eigen.sh (chmod +x):
#   #!/usr/bin/env sh
#   cd /opt/eigen && docker compose --env-file .env.production kill -s HUP postfix dovecot
services:
  postfix:
    volumes: !override
      - /etc/letsencrypt/live/${DOMAIN}:/certs:ro
      - ./data/dkim:/data/dkim
      - postfix-queue:/var/spool/postfix
  dovecot:
    volumes: !override
      - /etc/letsencrypt/live/${DOMAIN}:/certs:ro
      - ./data:/data
